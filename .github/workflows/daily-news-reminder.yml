name: Daily news reminder

on:
  schedule:
    # 每天 01:00 UTC（北京时间 09:00）检查一次
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 检查新闻数据是否过期
        id: freshness
        continue-on-error: true
        run: node scripts/check-freshness.mjs --max-age=1

      - name: 数据过期时创建提醒 Issue
        if: steps.freshness.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '今日新闻数据待更新';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            const body = [
              '自动检查发现 `news/index.json` 中的最新日期已落后超过 1 天。',
              '',
              '处理步骤：',
              '1. `npm run news:new`（或 `node scripts/new-day.mjs --date=YYYY-MM-DD`）生成当天模板',
              '2. 编辑 `news/data/YYYY-MM-DD.json`，替换为当天各类新闻（至少 10 个分类）',
              '3. `npm run news:validate` 通过后提交',
              '4. 发布新的插件版本，数据随插件分发给用户',
              '',
              '完成后可关闭本 Issue。',
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
