name: Publish extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 校验新闻数据
        run: node scripts/validate-news.mjs --strict

      - name: 运行测试
        run: |
          node scripts/test-webview.mjs
          node scripts/test-host.cjs

      - name: 编译
        run: npm run compile

      - name: 发布到 VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --no-git-tag-version
